# Default model & betting settings (committed). Changes made in the dashboard are saved to
# data/user_settings.yaml and override these values. See docs/MODEL_CARD.md for the reasoning.

# Leagues (football-data.co.uk codes). Chosen from the league screening in docs/RESEARCH.md.
leagues: [E0, E1, E2, EC, D1, D2, I1, I2, SP1, SP2, F1, B1]
first_season: 2012
markets: ["1X2", "OU25"]
active_model: blend      # Dixon-Coles pooled with the sharp market price (best out-of-sample)

# A selection is flagged as positive expected value only if ALL of these hold.
min_ev: 0.03            # at least +3% expected value per unit staked
min_edge: 0.01          # model probability at least 1 percentage point above implied probability
min_odds: 1.5
max_odds: 5.0
min_confidence: medium
require_robust_ev: true # EV must stay > 0 at the lower end of the 90% uncertainty interval
max_odds_age_hours: 96

dc_xi: 0.0019
dc_window_days: 1100
dc_ridge: 0.5
elo_k: 20.0
elo_home_advantage: 60.0
uncertainty_replicates: 30
min_team_matches: 10
retrain_every_days: 7

# Pooling weights for the blend [Dixon-Coles, sharp market]. Estimated out-of-sample on 2015-2026
# data (see reports/league_screening.md). Newer estimates from `sportpred evaluate` take precedence.
blend_weights:
  "1X2": {weights: [-0.069, 1.099], bias: [0.0, 0.038, 0.009]}
  "OU25": {weights: [-0.043, 1.060], bias: 0.010}

staking:
  method: flat
  flat_stake_pct: 1.0
  kelly_fraction: 0.25
  max_stake_pct: 2.0
  max_event_exposure_pct: 3.0
  max_daily_exposure_pct: 10.0
  max_competition_exposure_pct: 6.0
  starting_bankroll: 1000.0
